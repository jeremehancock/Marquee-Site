<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"
    role="img" aria-label="Placeholder screenshot of the Marquee gallery">
    <!--
      PLACEHOLDER — replace with a real screenshot of the Marquee gallery.
      Swap the <img src> in index.html to the new file (e.g. screenshot-gallery.png).
    -->
    <defs>
        <linearGradient id="poster" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3a3e46" />
            <stop offset="100%" stop-color="#2b2e34" />
        </linearGradient>
        <linearGradient id="posterWarm" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4a3c22" />
            <stop offset="100%" stop-color="#2e2b26" />
        </linearGradient>
    </defs>

    <rect width="1200" height="800" fill="#1c1e24" />

    <!-- top bar -->
    <rect x="0" y="0" width="1200" height="64" fill="#282a2d" />
    <rect x="0" y="63" width="1200" height="1" fill="#34373d" />
    <rect x="32" y="20" width="24" height="24" rx="6" fill="#e5a00d" />
    <rect x="68" y="26" width="96" height="12" rx="6" fill="#e9e6df" opacity=".85" />
    <rect x="820" y="20" width="220" height="24" rx="12" fill="#33363d" />
    <circle cx="838" cy="32" r="5" fill="#9aa0aa" />
    <rect x="1064" y="20" width="104" height="24" rx="12" fill="#e5a00d" opacity=".9" />

    <!-- tabs -->
    <rect x="32" y="96" width="72" height="10" rx="5" fill="#e9e6df" opacity=".9" />
    <rect x="32" y="120" width="72" height="3" rx="2" fill="#e5a00d" />
    <rect x="128" y="96" width="88" height="10" rx="5" fill="#9aa0aa" opacity=".6" />
    <rect x="240" y="96" width="104" height="10" rx="5" fill="#9aa0aa" opacity=".6" />
    <rect x="368" y="96" width="112" height="10" rx="5" fill="#9aa0aa" opacity=".6" />
    <rect x="504" y="96" width="96" height="10" rx="5" fill="#9aa0aa" opacity=".6" />
    <rect x="32" y="140" width="1136" height="1" fill="#34373d" />

    <!-- poster grid: 5 columns x 2 rows -->
    <g>
        <!-- row 1 -->
        <g>
            <rect x="32" y="172" width="204" height="306" rx="10" fill="url(#posterWarm)" stroke="#34373d" />
            <rect x="44" y="184" width="72" height="20" rx="10" fill="#c8871a" opacity=".92" />
            <rect x="56" y="404" width="120" height="10" rx="5" fill="#e9e6df" opacity=".55" />
            <rect x="56" y="424" width="80" height="8" rx="4" fill="#9aa0aa" opacity=".45" />
        </g>
        <g>
            <rect x="256" y="172" width="204" height="306" rx="10" fill="url(#poster)" stroke="#34373d" />
            <rect x="268" y="184" width="82" height="20" rx="10" fill="#2f8f7f" opacity=".92" />
            <rect x="280" y="404" width="144" height="10" rx="5" fill="#e9e6df" opacity=".55" />
            <rect x="280" y="424" width="92" height="8" rx="4" fill="#9aa0aa" opacity=".45" />
        </g>
        <g>
            <rect x="480" y="172" width="204" height="306" rx="10" fill="url(#poster)" stroke="#34373d" />
            <rect x="492" y="184" width="96" height="20" rx="10" fill="#3f7bb5" opacity=".92" />
            <rect x="504" y="404" width="116" height="10" rx="5" fill="#e9e6df" opacity=".55" />
            <rect x="504" y="424" width="72" height="8" rx="4" fill="#9aa0aa" opacity=".45" />
        </g>
        <g>
            <rect x="704" y="172" width="204" height="306" rx="10" fill="url(#posterWarm)" stroke="#34373d" />
            <rect x="716" y="184" width="90" height="20" rx="10" fill="#6d5ac0" opacity=".92" />
            <rect x="728" y="404" width="132" height="10" rx="5" fill="#e9e6df" opacity=".55" />
            <rect x="728" y="424" width="84" height="8" rx="4" fill="#9aa0aa" opacity=".45" />
        </g>
        <g>
            <rect x="928" y="172" width="204" height="306" rx="10" fill="url(#poster)" stroke="#34373d" />
            <rect x="940" y="184" width="72" height="20" rx="10" fill="#c8871a" opacity=".92" />
            <rect x="952" y="404" width="108" height="10" rx="5" fill="#e9e6df" opacity=".55" />
            <rect x="952" y="424" width="76" height="8" rx="4" fill="#9aa0aa" opacity=".45" />
        </g>

        <!-- row 2 (partially visible) -->
        <g opacity=".85">
            <rect x="32" y="500" width="204" height="272" rx="10" fill="url(#poster)" stroke="#34373d" />
            <rect x="256" y="500" width="204" height="272" rx="10" fill="url(#posterWarm)" stroke="#34373d" />
            <rect x="480" y="500" width="204" height="272" rx="10" fill="url(#poster)" stroke="#34373d" />
            <rect x="704" y="500" width="204" height="272" rx="10" fill="url(#poster)" stroke="#34373d" />
            <rect x="928" y="500" width="204" height="272" rx="10" fill="url(#posterWarm)" stroke="#34373d" />
        </g>
    </g>

    <!-- hover action bar on the third poster -->
    <g>
        <rect x="480" y="398" width="204" height="80" rx="10" fill="#1c1e24" opacity=".82" />
        <rect x="496" y="416" width="80" height="22" rx="11" fill="#e5a00d" />
        <rect x="584" y="416" width="84" height="22" rx="11" fill="#33363d" stroke="#4a4e57" />
        <rect x="496" y="448" width="60" height="18" rx="9" fill="#33363d" stroke="#4a4e57" />
        <rect x="564" y="448" width="60" height="18" rx="9" fill="#33363d" stroke="#4a4e57" />
    </g>

    <!-- fade at the bottom -->
    <rect x="0" y="700" width="1200" height="100" fill="#1c1e24" opacity=".55" />

    <text x="600" y="765" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15"
        fill="#9aa0aa" opacity=".65">Screenshot placeholder — gallery</text>
</svg>
